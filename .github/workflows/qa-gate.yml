name: QA Gate

# Reusable quality gate: typecheck + lint + test.
# Called by ci.yml (PRs) and by both deploy workflows before any deployment.

on:
  workflow_call:

jobs:
  qa-gate:
    name: typecheck + lint + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
